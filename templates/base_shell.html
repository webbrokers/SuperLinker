<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page_title}} — SuperLinker</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="SuperLinker">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="url(#lg)"/>
          <path d="M9 16h6m0 0a3 3 0 106 0m-6 0a3 3 0 116 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#818CF8"/></linearGradient></defs>
        </svg>
        <span class="logo-text">SuperLinker</span>
      </a>
      <nav class="main-nav" aria-label="Основное меню">
        <a href="/" class="nav-link {{nav_home}}">Главная</a>
        <a href="/shorten" class="nav-link {{nav_shorten}}">Сократить</a>
        <a href="/admin" class="nav-link {{nav_admin}}">Админ</a>
      </nav>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Переключить тему">◐</button>
    </div>
  </header>
  <main>
    {{content}}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>SuperLinker — сервис сокращения ссылок с аналитикой</p>
    </div>
  </footer>
</body>
</html>
