<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в админку — SuperLinker</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="url(#lg)"/><path d="M9 16h6m0 0a3 3 0 106 0m-6 0a3 3 0 116 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/><defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#818CF8"/></linearGradient></defs></svg>
        <span class="logo-text">SuperLinker</span>
      </a>
      <nav class="main-nav">
        <a href="/" class="nav-link">Главная</a>
        <a href="/shorten" class="nav-link">Сократить</a>
        <a href="/admin" class="nav-link active">Админ</a>
      </nav>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Тема">◐</button>
    </div>
  </header>

  <main class="container page-login">
    <div class="card login-card">
      <h1>Вход в админку</h1>
      <form method="post" action="/admin/login">
        <label class="label" for="password">Пароль</label>
        <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
        <p class="form-error">{{error}}</p>
        <button type="submit" class="btn-primary btn-block">Войти</button>
      </form>
    </div>
  </main>
</body>
</html>
